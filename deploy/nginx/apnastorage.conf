# Replace example.com with your domain, then:
#   sudo cp deploy/nginx/apnastorage.conf /etc/nginx/sites-available/apnastorage
#   sudo ln -sf /etc/nginx/sites-available/apnastorage /etc/nginx/sites-enabled/apnastorage
#   sudo nginx -t && sudo systemctl reload nginx
# After this file is live, run certbot. It adds the https server for you.

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    client_max_body_size 25m;

    root /var/www/apnastorage;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /media/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
