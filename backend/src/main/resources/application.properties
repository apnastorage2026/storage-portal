spring.application.name=apnastorage

# .env is not loaded by the operating system. Import it as properties.
# The first path works when the app is started from backend/.
# The second works when it is started from the repository root.
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

server.port=${SERVER_PORT:8080}

# PostgreSQL. Hibernate checks tables; Flyway creates them on a fresh database.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP_WITH_TIMEZONE

# V1 creates users, otp_codes, and images. V2 adds the image list index.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:25MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE:25MB}

# Signup reads the JWT and password settings. The rest are for later APIs.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}
app.media-root=${MEDIA_ROOT:./media}
app.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.otp.length=${OTP_LENGTH}
app.otp.expiry-minutes=${OTP_EXPIRY_MINUTES}
app.otp.max-attempts=${OTP_MAX_ATTEMPTS}
app.mail.from=${DEFAULT_FROM_EMAIL}
app.password.pbkdf2-iterations=${PASSWORD_PBKDF2_ITERATIONS:1500000}
app.swagger.enabled=${SWAGGER_ENABLED:true}
